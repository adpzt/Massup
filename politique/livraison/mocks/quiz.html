<div class="wrap" style="padding-top:40px;padding-bottom:72px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0 64px;align-items:start">
  <div>
    <div class="ov" style="display:flex;align-items:center;gap:10px">Économie<span style="width:28px;height:1px;background:var(--pol-line-2)"></span><span class="dim">Question 1</span></div>
    <h1 class="h-display" style="font-size:36px;margin:14px 0 20px">Impôts&nbsp;: en France, on paye trop ou pas assez&nbsp;?</h1>
    <p class="body-t" style="margin:0">Les <strong>impôts</strong> sont les sommes que les citoyens et les entreprises versent à l'État pour financer les services publics. En France, l'ensemble des prélèvements représente environ <strong>43 à 45&nbsp;% de la richesse produite chaque année</strong> (le PIB), l'un des taux les plus élevés au monde. Pour la <strong>droite et les libéraux</strong>, ce niveau est trop lourd&nbsp;: il découragerait le travail et l'investissement. Pour la <strong>gauche</strong>, ces impôts financent un modèle social protecteur et permettent de réduire les inégalités. Le débat oppose donc liberté économique et solidarité collective.</p>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--pol-line)"><span class="link" style="font-size:14px">Qui répond quoi&nbsp;? — position des candidats</span></div>
  </div>
  <div>
    <div class="opts">
      <div class="opt"><span class="radio"></span><span>Beaucoup trop. Baisse massive pour libérer l'économie.</span></div>
      <div class="opt"><span class="radio"></span><span>Trop. Une baisse ciblée et progressive serait bienvenue.</span></div>
      <div class="opt sel"><span class="radio"></span><span>À peu près correct, avec quelques ajustements.</span></div>
      <div class="opt"><span class="radio"></span><span>Bien calibré. Nos impôts financent des services essentiels.</span></div>
      <div class="opt"><span class="radio"></span><span>Pas assez pour les plus riches et les grandes entreprises.</span></div>
    </div>
    <div class="card" style="margin-top:32px;padding:16px 20px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px">
        <span style="font-size:13px;font-weight:700;color:var(--pol-txt-2)">Pertinence pour l'avenir de la France</span>
        <span class="tag gold">Essentielle</span>
      </div>
      <div class="scale5"><span>1</span><span>2</span><span class="on">3</span><span>4</span><span>5</span></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px"><span class="cap" style="font-size:12px">1 · peu</span><span class="cap" style="font-size:12px">5 · cruciale</span></div>
    </div>
    <div class="cap" style="text-align:center;margin:16px 0">Sauvegarde automatique sur cet appareil</div>
    <div class="btn-row"><span class="btn sec">Passer</span><span class="btn pri">Suivante →</span></div>
  </div>
</div>

  <h1 class="h-display" style="font-size:27px;line-height:1.22;margin:12px 0">Impôts&nbsp;: en France, on paye trop ou pas assez&nbsp;?</h1>
  <p class="body-t" style="font-size:15px;margin:0 0 20px">Les prélèvements représentent 43 à 45&nbsp;% du PIB, l'un des taux les plus élevés au monde. La <strong>droite</strong> y voit un frein au travail, la <strong>gauche</strong> le prix d'un modèle social protecteur. <span class="link" style="border:none;white-space:nowrap">Lire le contexte →</span></p>
